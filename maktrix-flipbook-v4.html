<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maktrix Digital Solutions — Flipbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<style>
  :root{
    --ink:#0d0d0f;
    --paper:#ffffff;
    --tint:#f6f6f4;
    --gray:#6c6c72;
    --line:#e4e4e0;
    --red:#c81e3a;
    --red-soft:#f7e3e6;
    --pw:520px;
    --ph:676px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at 50% 15%, #1c1c1f 0%, #0a0a0b 60%, #050506 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    padding:32px 12px;
    overflow-x:hidden;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .book-wrap{ position:relative; width:var(--pw); height:var(--ph); }
  #flipbook{ width:var(--pw); height:var(--ph); box-shadow:0 30px 70px -20px rgba(0,0,0,0.7), 0 10px 25px -8px rgba(0,0,0,0.55); }
  #flipbook .page{ overflow:hidden; background:var(--paper); }

  .page-num{
    position:absolute; bottom:16px; right:20px;
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.08em;
    color:rgba(13,13,15,.4); z-index:7;
  }
  .page.on-dark .page-num{ color:rgba(255,255,255,.45); }
  .hint{
    position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:rgba(255,255,255,.4); letter-spacing:.05em;
    white-space:nowrap; text-transform:uppercase;
  }

  /* NAV */
  .nav{ display:flex; align-items:center; gap:20px; }
  .nav button{
    width:42px; height:42px; border-radius:50%;
    background:transparent; border:1px solid rgba(255,255,255,.22);
    color:#f2f2f2; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s, border-color .2s, transform .15s;
  }
  .nav button:hover{ background:var(--red); border-color:var(--red); }
  .nav button:active{ transform:scale(.92); }
  .nav button:disabled{ opacity:.25; cursor:default; }
  .nav button:disabled:hover{ background:transparent; border-color:rgba(255,255,255,.22); }
  .dots{ display:flex; gap:6px; }
  .dot{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.25); transition:all .25s; cursor:pointer; }
  .dot.active{ background:var(--red); width:16px; border-radius:3px; }
  .counter{ font-family:'IBM Plex Mono',monospace; color:rgba(255,255,255,.45); font-size:10.5px; letter-spacing:.1em; }

  /* ===== shared content system ===== */
  .pad{ padding:44px 34px 36px; height:100%; display:flex; flex-direction:column; position:relative; }
  .ghost-num{
    position:absolute; top:-18px; right:-6px; font-family:'Space Grotesk'; font-weight:700;
    font-size:150px; color:var(--tint); z-index:0; line-height:1; user-select:none;
  }
  .on-dark .ghost-num{ color:rgba(255,255,255,.045); }
  .idx-row{ display:flex; align-items:center; gap:10px; position:relative; z-index:1; margin-bottom:18px; }
  .idx-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--red);
    border:1px solid var(--red); border-radius:20px; padding:3px 10px 3px 9px;
  }
  .on-dark .idx-tag{ color:var(--red); border-color:var(--red); }
  .idx-line{ flex:1; height:1px; background:var(--line); }
  .on-dark .idx-line{ background:rgba(255,255,255,.14); }

  h1.big{ font-family:'Space Grotesk'; font-weight:700; font-size:32px; line-height:1.14; color:var(--ink); letter-spacing:-.01em; position:relative; z-index:1; }
  .on-dark h1.big{ color:#fff; }
  h2.section-title{ font-family:'Space Grotesk'; font-weight:700; font-size:23px; color:var(--ink); line-height:1.2; letter-spacing:-.01em; position:relative; z-index:1; }
  .on-dark h2.section-title{ color:#fff; }
  .lead{ font-family:'Inter'; font-size:12px; color:var(--gray); line-height:1.68; margin-top:12px; position:relative; z-index:1; max-width:92%; }
  .lead.on-dark-txt{ color:rgba(255,255,255,.62); }

  .list-item{ display:flex; gap:12px; align-items:flex-start; margin-top:15px; position:relative; z-index:1; }
  .list-item .num{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--red); min-width:20px; padding-top:2px; }
  .list-item .icon-mini{ width:16px; height:16px; color:var(--ink); min-width:16px; margin-top:1px; }
  .on-dark .list-item .icon-mini{ color:#fff; }
  .list-txt{ font-family:'Inter'; font-weight:500; font-size:12px; color:var(--ink); line-height:1.45; }
  .on-dark .list-txt{ color:rgba(255,255,255,.88); }

  .logo-row{ display:flex; align-items:center; gap:9px; position:relative; z-index:1; }
  .logo-mark{ width:26px; height:26px; }
  .logo-name{ font-family:'Space Grotesk'; font-weight:700; font-size:14px; letter-spacing:.01em; }
  .on-dark .logo-name{ color:#fff; }
  .logo-sub{ font-family:'IBM Plex Mono'; font-size:7.5px; letter-spacing:.16em; color:var(--red); text-transform:uppercase; }

  /* flat bordered icon cards */
  .icon-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:26px; position:relative; z-index:1; background:var(--line); border:1px solid var(--line); }
  .on-dark .icon-grid{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.14); }
  .icon-card{
    padding:20px 12px; display:flex; flex-direction:column; align-items:flex-start; gap:14px; background:var(--paper);
    position:relative;
  }
  .on-dark .icon-card{ background:#111113; }
  .icon-card svg{ width:20px; height:20px; color:var(--ink); }
  .on-dark .icon-card svg{ color:var(--red); }
  .icon-card span{ font-family:'Space Grotesk'; font-weight:600; font-size:11px; color:var(--ink); }
  .on-dark .icon-card span{ color:#fff; }
  .icon-card .dot-mark{ position:absolute; top:10px; right:10px; width:5px; height:5px; border-radius:50%; background:var(--red); }

  .photo-box{ border-radius:2px; overflow:hidden; background:var(--tint); position:relative; z-index:1; }
  .photo-box img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-placeholder{
    width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--gray); font-family:'IBM Plex Mono'; font-size:9px; text-align:center; padding:10px;
    background:repeating-linear-gradient(135deg, #f6f6f4, #f6f6f4 9px, #ececea 9px, #ececea 18px);
  }
  .photo-placeholder svg{ width:20px; height:20px; opacity:.4; }

  .mockup{ margin-top:auto; position:relative; z-index:1; }
  .laptop-screen{
    background:var(--ink); border-radius:4px 4px 0 0; overflow:hidden; position:relative;
    aspect-ratio:16/10;
  }
  .laptop-screen img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .laptop-base{ height:7px; background:linear-gradient(180deg,#d5d5d3,#a3a3a1); border-radius:0 0 3px 3px; }

  .checklist{ display:flex; flex-direction:column; gap:13px; margin-top:22px; position:relative; z-index:1; }
  .check-row{ display:flex; align-items:center; gap:11px; }
  .check-row .num{ font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--red); min-width:16px; }
  .check-row span{ font-family:'Inter'; font-weight:500; font-size:12px; color:var(--ink); }

  .contact-row{ display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .contact-row svg{ width:14px; height:14px; color:var(--red); }
  .contact-row span{ font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:.02em; color:#ffffff; }
  .on-dark .contact-row span{ color:#ffffff !important; }

  .footer-tag{ text-align:center; margin-top:auto; font-family:'IBM Plex Mono'; font-size:9px; color:rgba(255,255,255,.35); letter-spacing:.14em; position:relative; z-index:1; display:flex; justify-content:center; }

  /* process (page 9) */
  .process-col{ display:flex; flex-direction:column; gap:0; margin-top:22px; position:relative; z-index:1; }
  .process-step{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .process-step:last-child{ border-bottom:none; }
  .process-num{
    width:30px; height:30px; min-width:30px; border-radius:50%; border:1.4px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; font-size:10.5px; color:var(--ink);
  }
  .process-step.highlight .process-num{ border-color:var(--red); color:var(--red); }
  .process-step h4{ font-family:'Space Grotesk'; font-weight:700; font-size:12px; color:var(--ink); }
  .process-step p{ font-family:'Inter'; font-size:10.5px; color:var(--gray); margin-top:3px; line-height:1.45; }

  /* industries (page 11) */
  .industry-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:22px; background:var(--line); border:1px solid var(--line); position:relative; z-index:1; }
  .industry-card{ padding:15px 5px; display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--paper); }
  .industry-card svg{ width:17px; height:17px; color:var(--ink); }
  .industry-card span{ font-family:'IBM Plex Mono'; font-weight:500; font-size:8px; color:var(--ink); text-align:center; letter-spacing:.01em; }
</style>
</head>
<body>

<div class="stage">
  <div class="book-wrap">
    <div id="flipbook"></div>
    <div class="hint">drag a corner, or use the arrows, to turn the page</div>
  </div>
  <div class="nav">
    <button id="prevBtn" aria-label="Previous page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button id="nextBtn" aria-label="Next page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div class="counter" id="counter">N° 01 / 12</div>
</div>

function idxRow(tag){
  return `<div class="idx-row"><div class="idx-tag">${tag}</div><div class="idx-line"></div></div>`;
}
function listItem(icon, n, text){
  return `<div class="list-item"><div class="num">${n}</div><svg class="icon-mini" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic[icon]}</svg><div class="list-txt">${text}</div></div>`;
}
function iconCard(icon,label){
  return `<div class="icon-card"><div class="dot-mark"></div>${s(icon)}<span>${label}</span></div>`;
}
function checkRow(n,text){
  return `<div class="check-row"><span class="num">${n}</span><span>${text}</span></div>`;
}
function contactRow(icon,text){
  return `<div class="contact-row">${s(icon)}<span>${text}</span></div>`;
}
function photoImg(filename, altText){
  return `<img src="images/${filename}" alt="${altText}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="photo-placeholder" style="display:none;">${s('image')}<span>Apna photo yahan daalo:<br><b>images/${filename}</b></span></div>`;
}

/* ================= BUILD DOM ================= */
const $book = $('#flipbook');
const $dots = $('#dots');
pages.forEach((p, i) => {
  const pageEl = $(`<div class="page ${p.dark?'on-dark':''}"></div>`).html(p.html + `<div class="page-num">N&deg; ${String(i+1).padStart(2,'0')} / 12</div>`);
  $book.append(pageEl);
  const dot = $(`<div class="dot ${i===0?'active':''}" data-i="${i}"></div>`);
  $dots.append(dot);
});

/* ================= INIT TURN.JS ================= */
$book.turn({
  width: 520,
  height: 676,
  autoCenter: true,
  duration: 900,
  gradients: true,
  elevation: 50,
  when: { turning: function(e, page){ updateNav(page); } }
});

function updateNav(page){
  $('#counter').text(`N° ${String(page).padStart(2,'0')} / 12`);
  $('.dot').removeClass('active').eq(page-1).addClass('active');
  $('#prevBtn').prop('disabled', page === 1);
  $('#nextBtn').prop('disabled', page === 12);
}
updateNav(1);

$('#nextBtn').on('click', () => $book.turn('next'));
$('#prevBtn').on('click', () => $book.turn('previous'));
$dots.on('click', '.dot', function(){ $book.turn('page', parseInt($(this).data('i')) + 1); });
$(document).on('keydown', function(e){
  if(e.key === 'ArrowRight') $book.turn('next');
  if(e.key === 'ArrowLeft') $book.turn('previous');
});
</script>
